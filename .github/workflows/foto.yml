name: Foto specie
on:
  push:
    branches: [foto-ricerca]
    paths: ['tools/**']
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/foto_candidati.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d fogli ] && git add -A fogli
          [ -d foto ] && git add -A foto
          git status --short | head -5
          git commit -m "Foto candidate dalle specie (Wikimedia Commons)" || echo "niente da salvare"
          git push
