name: Sonde fonti
on:
  push:
    branches: [sonde]
    paths: ['tools/sonde.py', 'tools/sonde2.py']
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/sonde.py
      - run: '[ -f tools/sonde2.py ] && python tools/sonde2.py || true'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sonde
          git commit -m "Risultati delle sonde" || echo "niente"
          git push
