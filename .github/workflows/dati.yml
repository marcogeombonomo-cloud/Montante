name: Dati ufficiali Venezia
on:
  schedule:
    - cron: '4,24,44 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/dati_venezia.py', '.github/workflows/dati.yml']
permissions:
  contents: write
concurrency:
  group: dati-venezia
  cancel-in-progress: false
jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: mkdir -p out && python tools/dati_venezia.py out/venezia.json
      - name: Pubblica sul ramo dati (un solo commit, sovrascritto ogni volta)
        run: |
          cd out
          git init -q -b dati
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venezia.json
          git commit -q -m "Dati Centro Maree $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dati
