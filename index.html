<style>
@font-face { font-family: 'Manrope'; font-style: normal; font-weight: 500; font-display: swap; src: url('manrope-500.woff2') format('woff2'); }
@font-face { font-family: 'Manrope'; font-style: normal; font-weight: 600; font-display: swap; src: url('manrope-600.woff2') format('woff2'); }
@font-face { font-family: 'Manrope'; font-style: normal; font-weight: 700; font-display: swap; src: url('manrope-700.woff2') format('woff2'); }
@font-face { font-family: 'Manrope'; font-style: normal; font-weight: 800; font-display: swap; src: url('manrope-800.woff2') format('woff2'); }
@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 600; font-display: swap; src: url('unbounded-600.woff2') format('woff2'); }
@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 700; font-display: swap; src: url('unbounded-700.woff2') format('woff2'); }

/* Layout: testata a tutta larghezza color mare profondo con l'indice ad anello, contenuti in schede che risalgono sull'onda, barra di navigazione flottante */
:root {
  --bg: #EDF2F4; --surface: #FFFFFF; --surface-2: #E7EEF1; --ink: #0A1E27; --muted: #5A6F79; --line: #DCE6EA; --card-line: transparent;
  --accent: #F2552C; --accent-ink: #FFFFFF; --accent-soft: rgba(242, 85, 44, .11);
  --tide: #1385C4; --night: rgba(10, 30, 39, .055);
  --sea: #CBE1EA; --land: #F4EFE0; --land-edge: #CDBF98; --grid: rgba(19, 133, 196, .13);
  --q1: #93A3AC; --q2: #4A8ED6; --q3: #13A9C2; --q4: #10A87C; --q5: #5FAE1C;
  --qt1: #0A1E27; --qt2: #FFFFFF; --qt3: #04232B; --qt4: #03231A; --qt5: #102600;
  --sol1: rgba(19, 133, 196, .15); --sol2: rgba(19, 133, 196, .06);
  --danger: #C62C22;
  --shadow: 0 1px 2px rgba(10, 30, 39, .05), 0 12px 32px -14px rgba(10, 30, 39, .22);
  --nav-bg: rgba(255, 255, 255, .84);
  /* testata: sempre mare notturno, in entrambi i temi */
  --hero-a: #031B25; --hero-b: #08485A; --hero-c: #0C7480; --on-hero: #F1FAFC; --on-hero-2: rgba(241, 250, 252, .7);
  --glass: rgba(255, 255, 255, .1); --glass-2: rgba(255, 255, 255, .18); --glass-line: rgba(255, 255, 255, .16);
  --hq1: #9DB2BC; --hq2: #6CB1F6; --hq3: #35D2E8; --hq4: #37E2A4; --hq5: #B6F15A;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05111A; --surface: #0C1C25; --surface-2: #132A35; --ink: #E5F0F4; --muted: #89A1AC; --line: #1A3240; --card-line: #16303C;
    --accent: #FF7A4F; --accent-ink: #1C0800; --accent-soft: rgba(255, 122, 79, .15);
    --tide: #5EC3F3; --night: rgba(0, 0, 0, .32);
    --sea: #092431; --land: #1C2520; --land-edge: #3B4A3E; --grid: rgba(94, 195, 243, .11);
    --q1: #6C808B; --q2: #5AA3EF; --q3: #2CCBE1; --q4: #2FDA9C; --q5: #A9E64D;
    --qt1: #03121A; --qt2: #03121A; --qt3: #03121A; --qt4: #03121A; --qt5: #03121A;
    --sol1: rgba(94, 195, 243, .17); --sol2: rgba(94, 195, 243, .07);
    --danger: #FF8A80;
    --shadow: 0 12px 32px -16px rgba(0, 0, 0, .7);
    --nav-bg: rgba(12, 28, 37, .86);
    --hero-a: #020D13; --hero-b: #05313F; --hero-c: #09596A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05111A; --surface: #0C1C25; --surface-2: #132A35; --ink: #E5F0F4; --muted: #89A1AC; --line: #1A3240; --card-line: #16303C;
  --accent: #FF7A4F; --accent-ink: #1C0800; --accent-soft: rgba(255, 122, 79, .15);
  --tide: #5EC3F3; --night: rgba(0, 0, 0, .32);
  --sea: #092431; --land: #1C2520; --land-edge: #3B4A3E; --grid: rgba(94, 195, 243, .11);
  --q1: #6C808B; --q2: #5AA3EF; --q3: #2CCBE1; --q4: #2FDA9C; --q5: #A9E64D;
  --qt1: #03121A; --qt2: #03121A; --qt3: #03121A; --qt4: #03121A; --qt5: #03121A;
  --sol1: rgba(94, 195, 243, .17); --sol2: rgba(94, 195, 243, .07);
  --danger: #FF8A80;
  --shadow: 0 12px 32px -16px rgba(0, 0, 0, .7);
  --nav-bg: rgba(12, 28, 37, .86);
  --hero-a: #020D13; --hero-b: #05313F; --hero-c: #09596A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; font-weight: 500;
  padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hero-a); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.75rem; letter-spacing: -.02em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; letter-spacing: -.01em; }
h3 { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
.eyebrow { font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .68rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
a { color: var(--tide); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 600px; margin: -26px auto 0; display: grid; gap: 14px; position: relative; z-index: 2; }

/* ===== testata ===== */
.hero { position: relative; color: var(--on-hero); background:
  radial-gradient(120% 80% at 85% 0%, var(--hero-c) 0%, transparent 60%),
  radial-gradient(90% 70% at 0% 100%, var(--hero-b) 0%, transparent 70%),
  linear-gradient(180deg, var(--hero-a), var(--hero-b)); overflow: hidden; }
.hero-in { max-width: 600px; margin: 0 auto; padding-block: calc(14px + env(safe-area-inset-top, 0px)) 58px; display: grid; gap: 16px; position: relative; z-index: 1; }
.hero.small .hero-in { padding-block: calc(16px + env(safe-area-inset-top, 0px)) 52px; gap: 6px; }
.hero .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: grid; gap: 1px; min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; letter-spacing: -.02em; }
.brand span { color: var(--on-hero-2); font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glassbtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--on-hero); border-radius: 999px; padding: 8px 14px 8px 11px; font-weight: 800; font-size: .88rem; max-width: 62%; min-width: 0; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.glassbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.glassbtn svg { flex: none; }
.hero .act { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: .9rem; box-shadow: 0 8px 20px -8px rgba(242, 85, 44, .7); white-space: nowrap; }
.hero-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero-title p { margin: 4px 0 0; color: var(--on-hero-2); font-size: .9rem; font-weight: 600; }
.wave { position: absolute; left: 0; right: 0; bottom: -1px; height: 54px; pointer-events: none; }
.wave svg { position: absolute; bottom: 0; width: 200%; height: 54px; }
.wave .w1 { animation: drift 16s linear infinite; opacity: .35; }
.wave .w2 { animation: drift 24s linear infinite reverse; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { border: 1px solid var(--glass-line); background: var(--glass); color: var(--on-hero); border-radius: 16px; padding: 7px 0 8px; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.day .dw { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--on-hero-2); }
.day .dn { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; line-height: 1.15; }
.day .dot { width: 18px; height: 4px; border-radius: 4px; }
.day[aria-pressed="true"] { background: var(--on-hero); color: var(--hero-a); border-color: transparent; }
.day[aria-pressed="true"] .dw { color: var(--hero-b); }

.gaugebox { display: grid; justify-items: center; gap: 10px; }
.gauge { position: relative; width: 236px; height: 200px; }
.gauge svg { width: 236px; height: 200px; display: block; overflow: visible; }
.gauge .gv { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; padding-top: 6px; }
.gauge .gv b { font-family: var(--f-display); font-weight: 700; font-size: 4.2rem; line-height: .95; letter-spacing: -.04em; }
.gauge .gv .ql { font-family: var(--f-display); font-weight: 600; font-size: 1rem; margin-top: 6px; }
.gauge .gv .gs { font-size: .72rem; color: var(--on-hero-2); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }
.hchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.hchip { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 5px 11px; background: var(--glass); border: 1px solid var(--glass-line); color: var(--on-hero); white-space: nowrap; }
.hchip.hot { background: var(--accent); border-color: transparent; color: #fff; }
.nextwin { margin: 0; text-align: center; font-weight: 700; font-size: .92rem; color: var(--on-hero); }
.nextwin span { color: var(--on-hero-2); font-weight: 600; }

/* ===== schede ===== */
.card { background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.banner { font-size: .86rem; padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--card-line); font-weight: 600; }

/* finestre */
.wins { display: grid; gap: 8px; }
.win { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 16px; background: var(--surface-2); }
.win .wt { font-weight: 800; font-size: 1.12rem; letter-spacing: -.01em; }
.win .wr { font-size: .8rem; color: var(--muted); font-weight: 600; }
.ring { position: relative; width: 46px; height: 46px; display: grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; }
.ring b { position: relative; font-weight: 800; font-size: .95rem; }

/* grafico */
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: .84rem; color: var(--muted); font-weight: 600; min-height: 1.6em; }
.readout b { font-weight: 800; font-size: 1.05rem; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .76rem; color: var(--muted); font-weight: 600; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
.seglabel { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); gap: 2px; }

/* marea */
.tides { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 8px; }
.tide { border-radius: 16px; background: var(--surface-2); padding: 10px; display: grid; gap: 2px; justify-items: start; }
.tide .k { display: flex; align-items: center; gap: 4px; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.tide .t { font-weight: 800; font-size: 1.15rem; }
.tide .h { font-size: .8rem; color: var(--tide); font-weight: 800; }
.tidenow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: linear-gradient(90deg, var(--sol1), transparent); font-size: .9rem; font-weight: 600; }
.tidenow b { font-weight: 800; font-size: 1.05rem; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; font-weight: 500; }

/* sole e luna */
.sky { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.moon { width: 64px; height: 64px; }
.skyarc svg { width: 100%; height: auto; display: block; }
.kvs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kv { display: grid; gap: 1px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.kv .k { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
.kv .v { font-weight: 800; font-size: 1.08rem; }
.sols { display: flex; flex-wrap: wrap; gap: 6px; }
.sol { display: inline-flex; align-items: baseline; gap: 6px; border-radius: 12px; padding: 6px 10px; background: var(--sol1); font-weight: 800; font-size: .92rem; }
.sol.m { background: var(--sol2); }
.sol span { font-weight: 600; font-size: .74rem; color: var(--muted); }

/* condizioni */
.cgroup { display: grid; gap: 7px; }
.flabel { font-size: .72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: .86rem; font-weight: 700; transition: background .15s, color .15s, border-color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 700; border-radius: 999px; padding: 8px 13px; text-decoration: none; color: var(--ink); background: var(--surface-2); }

/* specie */
.splist { display: grid; gap: 4px; }
.sprow { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 8px 4px; border: 0; background: none; text-align: left; border-radius: 14px; width: 100%; }
.sprow:hover { background: var(--surface-2); }
.sprow .nm { font-weight: 800; font-size: 1rem; }
.sprow .ds { font-size: .8rem; color: var(--muted); font-weight: 600; display: block; }
.sprow .go { color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--tide); font-weight: 800; font-size: .88rem; text-align: left; }

details.how:not([open]) { gap: 0; }
details.how summary { cursor: pointer; font-weight: 800; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::after { content: "+"; font-size: 1.3rem; color: var(--muted); }
details.how[open] summary::after { content: "−"; }
details.how table { width: 100%; border-collapse: collapse; font-size: .88rem; }
details.how td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
details.how td:last-child { text-align: right; font-weight: 800; padding-left: 10px; }

/* mappa */
.mapbox { position: relative; border-radius: var(--r); overflow: hidden; background: var(--sea); box-shadow: var(--shadow); }
.mapctl { position: absolute; right: 12px; top: 12px; display: grid; gap: 8px; }
.mapctl button { border: 0; background: var(--nav-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 50%; width: 40px; height: 40px; font-size: 1.25rem; font-weight: 800; box-shadow: var(--shadow); color: var(--ink); }
.maptip { position: absolute; left: 12px; right: 64px; top: 12px; padding: 10px 14px; border-radius: 14px; font-size: .86rem; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
.spotcard { display: grid; gap: 10px; }
.spotrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.spotrow h3 { min-width: 0; overflow-wrap: anywhere; font-size: 1.1rem; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }

/* bottoni */
.btn { border: 0; background: var(--surface-2); border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: .88rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn.pri { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px -10px var(--accent); }
.btn.danger { color: var(--danger); background: transparent; border: 1.5px solid var(--line); }
.btn.block { width: 100%; padding: 14px; font-size: 1rem; border-radius: 16px; }
.btn[disabled] { opacity: .5; }
.pill { font-weight: 800; font-size: .95rem; border-radius: 999px; padding: 3px 10px; min-width: 40px; text-align: center; }

/* diario */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 16px; padding: 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.stat b { font-family: var(--f-display); font-weight: 600; font-size: 1.6rem; line-height: 1; letter-spacing: -.03em; overflow-wrap: anywhere; }
.stat span { font-size: .72rem; color: var(--muted); font-weight: 700; }
.lift { display: grid; gap: 7px; }
.lift .row { display: grid; grid-template-columns: 96px 1fr 40px; gap: 10px; align-items: center; font-size: .84rem; font-weight: 600; }
.lift .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 6px; }
.lift .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--q3), var(--q4)); }
.lift .track u { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--ink); opacity: .5; }
.entry { display: grid; gap: 8px; text-align: left; border: 1px solid var(--card-line); background: var(--surface); border-radius: var(--r); padding: 16px 18px; width: 100%; box-shadow: var(--shadow); }
.entry .eh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs img { width: 68px; height: 68px; object-fit: cover; border-radius: 12px; flex: none; background: var(--surface-2); }
.empty { text-align: center; padding: 28px 18px; justify-items: center; }
.empty .ic { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }

/* calendario */
.calwrap { overflow-x: auto; }
table.cal { border-collapse: separate; border-spacing: 3px; font-size: .78rem; width: 100%; table-layout: fixed; }
table.cal col.nc { width: 34%; }
table.cal th { font-weight: 800; color: var(--muted); font-size: .72rem; text-align: center; }
table.cal th.now { color: var(--accent); }
table.cal td.n { padding-right: 4px; line-height: 1.15; }
table.cal td.n button { border: 0; background: none; padding: 3px 0; font-weight: 800; text-align: left; font-size: .82rem; }
table.cal td.c { height: 22px; border-radius: 6px; }
table.cal td.c.now { box-shadow: inset 0 0 0 2px var(--accent); }
.gearlist { display: grid; gap: 8px; }
.gear { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--surface-2); }

<script>
/*

 SunCalc is a JavaScript library for calculating sun/moon position and light phases.
 https://github.com/mourner/suncalc
*/

(function () { 'use strict';

// shortcuts for easier to read formulas

var PI   = Math.PI,
    sin  = Math.sin,
    cos  = Math.cos,
    tan  = Math.tan,
    asin = Math.asin,
    atan = Math.atan2,
    acos = Math.acos,
    rad  = PI / 180;

// sun calculations are based on http://aa.quae.nl/en/reken/zonpositie.html formulas


// date/time constants and conversions

var dayMs = 1000 * 60 * 60 * 24,
    J1970 = 2440588,
    J2000 = 2451545;

function toJulian(date) { return date.valueOf() / dayMs - 0.5 + J1970; }
function fromJulian(j)  { return new Date((j + 0.5 - J1970) * dayMs); }
function toDays(date)   { return toJulian(date) - J2000; }


// general calculations for position

var e = rad * 23.4397; // obliquity of the Earth

function rightAscension(l, b) { return atan(sin(l) * cos(e) - tan(b) * sin(e), cos(l)); }
function declination(l, b)    { return asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l)); }

function azimuth(H, phi, dec)  { return atan(sin(H), cos(H) * sin(phi) - tan(dec) * cos(phi)); }
function altitude(H, phi, dec) { return asin(sin(phi) * sin(dec) + cos(phi) * cos(dec) * cos(H)); }

function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }

function astroRefraction(h) {
    if (h < 0) // the following formula works for positive altitudes only.
        h = 0; // if h = -0.08901179 a div/0 would occur.

    // formula 16.4 of "Astronomical Algorithms" 2nd edition by Jean Meeus (Willmann-Bell, Richmond) 1998.
    // 1.02 / tan(h + 10.26 / (h + 5.10)) h in degrees, result in arc minutes -> converted to rad:
    return 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179));
}

// general sun calculations

function solarMeanAnomaly(d) { return rad * (357.5291 + 0.98560028 * d); }

function eclipticLongitude(M) {

    var C = rad * (1.9148 * sin(M) + 0.02 * sin(2 * M) + 0.0003 * sin(3 * M)), // equation of center
        P = rad * 102.9372; // perihelion of the Earth

    return M + C + P + PI;
}

function sunCoords(d) {

    var M = solarMeanAnomaly(d),
        L = eclipticLongitude(M);

    return {
        dec: declination(L, 0),
        ra: rightAscension(L, 0)
    };
}


var SunCalc = {};


// calculates sun position for a given date and latitude/longitude

SunCalc.getPosition = function (date, lat, lng) {

    var lw  = rad * -lng,
        phi = rad * lat,
        d   = toDays(date),

        c  = sunCoords(d),
        H  = siderealTime(d, lw) - c.ra;

    return {
        azimuth: azimuth(H, phi, c.dec),
        altitude: altitude(H, phi, c.dec)
    };
};


// sun times configuration (angle, morning name, evening name)

var times = SunCalc.times = [
    [-0.833, 'sunrise',       'sunset'      ],
    [  -0.3, 'sunriseEnd',    'sunsetStart' ],
    [    -6, 'dawn',          'dusk'        ],
    [   -12, 'nauticalDawn',  'nauticalDusk'],
    [   -18, 'nightEnd',      'night'       ],
    [     6, 'goldenHourEnd', 'goldenHour'  ]
];

// adds a custom time to the times config

SunCalc.addTime = function (angle, riseName, setName) {
    times.push([angle, riseName, setName]);
};


// calculations for sun times

var J0 = 0.0009;

function julianCycle(d, lw) { return Math.round(d - J0 - lw / (2 * PI)); }

function approxTransit(Ht, lw, n) { return J0 + (Ht + lw) / (2 * PI) + n; }
function solarTransitJ(ds, M, L)  { return J2000 + ds + 0.0053 * sin(M) - 0.0069 * sin(2 * L); }

function hourAngle(h, phi, d) { return acos((sin(h) - sin(phi) * sin(d)) / (cos(phi) * cos(d))); }
function observerAngle(height) { return -2.076 * Math.sqrt(height) / 60; }

// returns set time for the given sun altitude
function getSetJ(h, lw, phi, dec, n, M, L) {

    var w = hourAngle(h, phi, dec),
        a = approxTransit(w, lw, n);
    return solarTransitJ(a, M, L);
}


// calculates sun times for a given date, latitude/longitude, and, optionally,
// the observer height (in meters) relative to the horizon

SunCalc.getTimes = function (date, lat, lng, height) {

    height = height || 0;

    var lw = rad * -lng,
        phi = rad * lat,

        dh = observerAngle(height),

        d = toDays(date),
        n = julianCycle(d, lw),
        ds = approxTransit(0, lw, n),

        M = solarMeanAnomaly(ds),
        L = eclipticLongitude(M),
        dec = declination(L, 0),

        Jnoon = solarTransitJ(ds, M, L),

        i, len, time, h0, Jset, Jrise;


    var result = {
        solarNoon: fromJulian(Jnoon),
        nadir: fromJulian(Jnoon - 0.5)
    };

    for (i = 0, len = times.length; i < len; i += 1) {
        time = times[i];
        h0 = (time[0] + dh) * rad;

        Jset = getSetJ(h0, lw, phi, dec, n, M, L);
        Jrise = Jnoon - (Jset - Jnoon);

        result[time[1]] = fromJulian(Jrise);
        result[time[2]] = fromJulian(Jset);
    }

    return result;
};

/* ---------- foto sul telefono (IndexedDB) ---------- */
const fotoURL = new Map();
const Photos = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open('montante', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('foto');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('foto', mode), r = fn(t.objectStore('foto'));
      let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || { name: 'QuotaExceededError' });
    });
  },
  put(blob, id) { id = id || uid(); return this.tx('readwrite', st => st.put(blob, id)).then(() => id); },
  get(id) { return this.tx('readonly', st => st.get(id)); },
  del(id) { const u = fotoURL.get(id); if (u) { URL.revokeObjectURL(u); fotoURL.delete(id); } return this.tx('readwrite', st => st.delete(id)); },
  clear() { for (const u of fotoURL.values()) URL.revokeObjectURL(u); fotoURL.clear(); return this.tx('readwrite', st => st.clear()); },
};
async function hydrate(root) {
  for (const img of (root || document).querySelectorAll('img[data-foto]:not([src])')) {
    const id = img.dataset.foto;
    let u = fotoURL.get(id);
    if (!u) {
      try { const b = await Photos.get(id); if (!b) continue; u = URL.createObjectURL(b); fotoURL.set(id, u); } catch (e) { continue; }
    }
    img.src = u;
  }
}

const FISH_PH = '<svg class="ph" width="56" height="56" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 12c3-4.2 7.8-6 12.5-4.2L21.5 4v16l-6.5-3.8C10.3 18 5.5 16.2 2.5 12z"/></svg>';
const Taxa = {
  KEY: 'montante:taxa', map: {}, queue: [], busy: false,
  load() { try { this.map = JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (e) { this.map = {}; } },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.map)); } catch (e) { /* senza cache */ } },
  get(latin) { const t = this.map[latin]; return t && t.url ? t : null; },
  want(latin, first) {
    const t = this.map[latin];

    const i = this.queue.indexOf(latin);
    if (i >= 0) { if (!first) return; this.queue.splice(i, 1); }
    if (first) this.queue.unshift(latin); else this.queue.push(latin);
    this.pump();
  },
  async pump() {
    if (this.busy || !navigator.onLine) return;

      const latin = this.queue.shift();

        const r = await fetch(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(latin)}&per_page=5&locale=it`);
        if (r.ok) {
          const list = (await r.json()).results || [];
          const t = list.find(x => String(x.name || '').toLowerCase() === latin.toLowerCase()) || list.find(x => x.rank === 'species') || list[0];
          const p = t && t.default_photo;
          this.map[latin] = p && (p.medium_url || p.url) ? { url: p.medium_url || p.url, attr: p.attribution || '', id: t.id } : { none: true, at: Date.now() };
          this.save();
          fillTaxon(latin);
        }
      } catch (e) { /* senza rete: riprova alla prossima apertura */ }
      await new Promise(res => setTimeout(res, 1000)); // iNaturalist chiede al massimo una richiesta al secondo
    }

  },
};

}
function taxonCredit(latin) {
  const t = Taxa.get(latin);

function fillTaxon(latin) {
  const t = Taxa.get(latin); if (!t) return;

    if (el.dataset.taxon !== latin || el.querySelector('img')) continue;

  const P = pts.map(p => [x(p.t), yI(p.v)]);
  let line = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for (let i = 1; i < P.length; i++) { const [xa, ya] = P[i - 1], [xb, yb] = P[i]; const xm = (xa + xb) / 2; line += ` C${xm.toFixed(1)} ${ya.toFixed(1)} ${xm.toFixed(1)} ${yb.toFixed(1)} ${xb.toFixed(1)} ${yb.toFixed(1)}`; }

function bindChart(pts, sp, d0) {
  const svg = $('#chart'); if (!svg) return;
  const ro = $('#readout');

    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * 360;
    const t = d0 + Math.max(0, Math.min(1, (fx - 8) / 344)) * DAY;
    const tt = Math.round(t / (15 * MIN)) * 15 * MIN;
    const p = pts.reduce((a, b) => Math.abs(b.t - tt) < Math.abs(a.t - tt) ? b : a);
    const x = 8 + (p.t - d0) / DAY * 344, y = 166 - p.v * 1.38;
    $('#cur', svg).setAttribute('visibility', 'visible');
    $('#curl', svg).setAttribute('x1', x); $('#curl', svg).setAttribute('x2', x);
    $('#curd', svg).setAttribute('cx', x); $('#curd', svg).setAttribute('cy', y);
    ro.innerHTML = readoutHTML(p.t, sp);
  };
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) move(e); });
}

const CAMERA = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>';
const fmtCm = n => String(Math.round(n * 10) / 10).replace('.', ',');
function verdictHTML(g, cmTxt) {
  const n = Number(String(cmTxt || '').replace(',', '.'));
  if (!g) return '';
  if (!g.min) return `<div class="verdict"><div class="big">—<small>misura</small></div><div><b>Nessuna misura minima nazionale</b><p>Verifica eventuali ordinanze locali e rilascia gli esemplari piccoli.</p></div></div>`;
  if (!cmTxt || !isFinite(n) || n <= 0) return `<div class="verdict"><div class="big">${g.min}<small>cm minimi</small></div><div><b>${esc(g.nome)}</b><p>Lunghezza totale, dalla punta del muso alla fine della coda.</p></div></div>`;
  const ok = n >= g.min;
  return `<div class="verdict ${ok ? 'ok' : 'bad'}"><div class="big">${g.min}<small>cm minimi</small></div><div><b>${ok ? 'Sopra misura' : 'Sotto misura: rilascialo'}</b><p>${esc(g.nome)} di ${fmtCm(n)} cm${ok ? '' : `, mancano ${fmtCm(g.min - n)} cm`}.</p></div></div>`;
}
function guideCardHTML(g) {
  return `<button class="gcard" data-act="guide" data-id="${g.id}">${taxonImg(g.lat)}<span class="gtx"><span class="nm">${esc(g.nome)}</span><span class="lat">${esc(g.lat)}</span><span>${g.min ? `<span class="minb">min ${g.min} cm</span>` : '<span class="minb none">nessuna minima</span>'}${g.pericolo && g.id === 'tracina' ? '<span class="minb danger">velenosa</span>' : ''}</span></span></button>`;
}
function guideMatch(q) {
  q = q.trim().toLowerCase();
  return GUIDE.filter(g => !q || (g.nome + ' ' + g.lat + ' ' + (g.alias || '')).toLowerCase().includes(q));
}
function renderCatture() {
  const conMin = GUIDE.filter(g => g.min).sort((a, b) => a.nome.localeCompare(b.nome));

  app.innerHTML = heroSmall('Catture', 'Riconosci i pesci e controlla le misure minime') + `
  <div class="wrap gut">

    <a class="btn pri block" href="${RICONOSCI_URL}" target="_blank" rel="noopener">${CAMERA} Apri il riconoscimento</a>

      <div class="field"><label for="mq-cm">Misura (cm)</label><input id="mq-cm" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Es. 22" value="${esc(S.mqCm || '')}"></div>

  <div class="search"><input id="cq" type="search" placeholder="Cerca un pesce: orata, sarago, cefalo…" value="${esc(S.cq || '')}" aria-label="Cerca un pesce" autocomplete="off"></div>
  <div class="guide" id="guide">${list.map(guideCardHTML).join('') || '<p class="muted">Nessun pesce trovato.</p>'}</div>
  <section class="card rules">
    <h2>Regole da ricordare</h2>
    <p>La misura è la lunghezza totale, dalla punta del muso all'estremità della coda.</p>
    <p>Pesca sportiva in mare: al massimo 5 kg di pescato al giorno a persona, salvo un singolo pesce più pesante, e una sola cernia al giorno.</p>
    <p>Controlla sempre anche le ordinanze della Capitaneria di porto di Chioggia per zone e periodi vietati.</p>
    <p class="hint">Misure minime dal Reg. (UE) 2019/1241, allegato IX, e dal D.P.R. 1639/1968. Foto delle specie da iNaturalist.</p>
  </section>
  </div>`;
  const out = $('#mq-out');

/* ---------- fogli ---------- */
function sheet(html, onMount) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-bg" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  if (onMount) onMount($('.sheet', root));
  hydrate(root);
  const f = $('.sheet input, .sheet select, .sheet button:not(.x)', root); if (f && f.tagName !== 'BUTTON') { /* niente auto-focus per non aprire la tastiera */ }
}
function closeSheet() { $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; if (S.pending) { S.pending = null; render(); } }
function toast(msg) {
  const r = $('#toast-root'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}
const top = (title) => `<div class="sheet-top"><h2>${title}</h2><button class="x" data-act="close" aria-label="Chiudi">✕</button></div>`;

function openPickSpot() {
  const list = spotsSorted(), sel = currentSpot(), now = Date.now(), cond = condToday();
  sheet(top('Scegli lo spot') + (list.length ? list.map(s => {
    const sc = PE.scoreAt(now, s, { cond: condAt(now, s), model: getModel() }).v;
    return `<button class="entry" data-act="usespot" data-id="${esc(s.id)}" data-close="1"><span class="eh"><h3>${esc(s.nome)}</h3><span class="pill num" style="background:${qCol(sc)};color:${qTxt(sc)}">${sc}</span></span><span class="small muted">${TIPI[s.tipo] || ''}${s.id === sel.id ? ' · in uso' : ''}</span></button>`;
  }).join('') : '<p class="muted">Non hai ancora spot salvati.</p>') + `${list.length ? `<button class="btn pri block" data-act="nearest" data-close="1">${PIN} Lo spot più vicino a me</button>` : ''}<button class="btn block" data-act="go" data-tab="spot" data-close="1">Gestisci gli spot</button>`);
}

function openSpotSheet(id, at) {
  const s = id ? S.spots.find(x => x.id === id) : null;
  const d = s || { nome: '', tipo: 'spiaggia', lat: at ? at.lat : 45.205, lon: at ? at.lon : 12.303, anticipo: 47, note: '' };

      </div>
      <p class="hint">Rispetto a Punta della Salute (tabelle del Centro Maree): mare aperto e dighe della bocca di Chioggia circa 47 min prima, Chioggia Vigo circa 20.</p>
      <div class="row2">
        <div class="field"><label for="sp-lat">Latitudine</label><input id="sp-lat" type="number" step="0.00001" inputmode="decimal" required value="${esc(d.lat)}"></div>
        <div class="field"><label for="sp-lon">Longitudine</label><input id="sp-lon" type="number" step="0.00001" inputmode="decimal" required value="${esc(d.lon)}"></div>
      </div>
      <button class="btn block" type="button" id="sp-gps">${PIN} Usa la mia posizione attuale</button>
      <div class="field"><label for="sp-note">Note</label><textarea id="sp-note" maxlength="600" placeholder="Fondale, buche, dove si incaglia, parcheggio…">${esc(d.note || '')}</textarea></div>
      <button class="btn pri block" type="submit">${s ? 'Salva modifiche' : 'Salva spot'}</button>
      ${s ? `<div id="delzone"><button class="btn danger block" type="button" data-act="askdel">Elimina spot</button></div>` : ''}
    </form>`, el => {
    $('#sp-tipo', el).addEventListener('change', e => { const a = $('#sp-ant', el); if (!s) a.value = e.target.value === 'laguna' ? 20 : 47; });
    $('#sp-gps', el).addEventListener('click', async () => {
      const b = $('#sp-gps', el); b.disabled = true; b.textContent = 'Cerco la posizione…';
      try { const p = await locate(); $('#sp-lat', el).value = p.lat.toFixed(5); $('#sp-lon', el).value = p.lon.toFixed(5); toast(`Posizione presa (±${Math.round(p.acc)} m)`); }
      catch (err) { toast(geoErr(err)); }
      finally { b.disabled = false; b.innerHTML = PIN + ' Usa la mia posizione attuale'; }
    });
    $('#spotf', el).addEventListener('submit', async e => {
      e.preventDefault();
      const data = {
        nome: $('#sp-nome', el).value.trim() || 'Spot', tipo: $('#sp-tipo', el).value,
        anticipo: Number($('#sp-ant', el).value) || 0, lat: Number($('#sp-lat', el).value), lon: Number($('#sp-lon', el).value),
        note: $('#sp-note', el).value.trim(), ordine: s ? (s.ordine || 0) : S.spots.length + 1,
      };
      if (!isFinite(data.lat) || !isFinite(data.lon) || Math.abs(data.lat) > 90 || Math.abs(data.lon) > 180) { toast('Coordinate non valide'); return; }
      const nid = s ? s.id : uid();
      S.pending = null;
      try { await Store.saveDoc('spots', nid, data); if (!s && !S.spots.length) await Store.setRoot({ spotSel: nid }); closeSheet(); toast(s ? 'Spot aggiornato' : 'Spot salvato'); }
      catch (err) { toast(errMsg(err)); }
    });
    const dz = $('#delzone', el);
    if (dz) dz.addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'askdel') dz.innerHTML = `<div class="confirm"><span>Eliminare “${esc(s.nome)}”? Le uscite già registrate restano nel diario.</span><button class="btn danger" type="button" data-act="dodel">Elimina</button><button class="btn" type="button" data-act="nodel">Annulla</button></div>`;
      if (b.dataset.act === 'nodel') dz.innerHTML = `<button class="btn danger block" type="button" data-act="askdel">Elimina spot</button>`;
      if (b.dataset.act === 'dodel') { try { await Store.delDoc('spots', s.id); closeSheet(); toast('Spot eliminato'); } catch (err) { toast(errMsg(err)); } }
    });
  });
}

async function shrink(file) {
  const max = 1600;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.82));
}

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function buildBackup() {
  const foto = {};
  for (const u of S.uscite) for (const c of (u.catture || [])) for (const id of (c.foto || [])) {
    if (foto[id]) continue;
    try { const b = await Photos.get(id); if (b) foto[id] = await blobToDataURL(b); } catch (e) { /* foto mancante */ }
  }
  const d = Store.local;
  const out = { app: 'montante', v: 1, creato: new Date().toISOString(), root: d.root, spots: d.spots, uscite: d.uscite, foto };
  const name = `montante-backup-${isoDay(Date.now())}.json`;
  const text = JSON.stringify(out);
  return { name, text, size: text.length, nFoto: Object.keys(foto).length };
}
function parseBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('Il file non è un backup di Montante.'); }
  if (!d || d.app !== 'montante' || typeof d.root !== 'object' || typeof d.spots !== 'object' || typeof d.uscite !== 'object') throw new Error('Il file non è un backup di Montante.');
  return d;
}
async function applyBackup(d) {
  await Photos.clear().catch(() => {});
  for (const [id, url] of Object.entries(d.foto || {})) {
    try { const b = await (await fetch(url)).blob(); await Photos.put(b, id); } catch (e) { /* foto saltata */ }
  }
  const root = Object.assign({}, d.root, { benvenuto: true });
  Store.replaceAll({ root, spots: d.spots, uscite: d.uscite });
  curveCache.clear();
}

      catch (err) { conf.innerHTML = `<div class="confirm"><span>${esc(err.message)}</span></div>`; return; }
      const d = pendingImport, ns = Object.keys(d.spots).length, nu = Object.keys(d.uscite).length, ng = (d.root.gear || []).length;
      conf.innerHTML = `<div class="confirm"><span>Backup del ${d.creato ? esc(fDay(Date.parse(d.creato))) : '?'}: ${ns} spot, ${ng} attrezzi, ${nu} ${nu === 1 ? 'uscita' : 'uscite'}${Object.keys(d.foto || {}).length ? ', ' + Object.keys(d.foto).length + ' foto' : ''}. Sostituire i dati attuali?</span><button class="btn pri" type="button" data-x="doimp">Ripristina</button><button class="btn" type="button" data-x="noimp">Annulla</button></div>`;
    };
    $('#imp-file', el).addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      askImport(await f.text()); e.target.value = '';
    });
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const x = b.dataset.x;
      if (x === 'prep') {
        b.disabled = true; b.textContent = 'Preparo il backup…';
        try {
          const bk = await buildBackup();
          exp.innerHTML = `<button class="btn pri block" type="button" data-x="share">Salva il backup (${Math.max(1, Math.round(bk.size / 1024))} KB${bk.nFoto ? ', ' + bk.nFoto + ' foto' : ''})</button><p class="hint" style="margin-top:6px">Nel foglio di condivisione scegli «Salva in File».</p>`;
          exp._bk = bk;
        } catch (err) { b.disabled = false; b.textContent = 'Crea il backup'; toast('Backup non riuscito, riprova.'); }
      } else if (x === 'share') {
        const bk = exp._bk; if (!bk) return;
        const mk = type => new File([bk.text], bk.name, { type });
        let file = mk('application/json');
        if (navigator.canShare && !navigator.canShare({ files: [file] })) file = mk('text/plain');
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: 'Backup Montante' }); toast('Backup pronto'); }
          catch (err) { if (err && err.name !== 'AbortError') toast('Condivisione non riuscita'); }
        } else {
          const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = bk.name;
          document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
          toast('Backup scaricato');
        }
      } else if (x === 'paste') {
        askImport($('#imp-text', el).value.trim());
      } else if (x === 'noimp') {
        pendingImport = null; conf.innerHTML = '';
      } else if (x === 'doimp' && pendingImport) {
        b.disabled = true; b.textContent = 'Ripristino…';
        try { await applyBackup(pendingImport); closeSheet(); render(); toast('Dati ripristinati'); Meteo.refresh(currentSpot()); }
        catch (err) { b.disabled = false; b.textContent = 'Ripristina'; toast(errMsg(err)); }
      } else if (x === 'meteo') {
        closeSheet(); Meteo.refresh(currentSpot(), true);
      }
    });
    if (focus === 'import') setTimeout(() => $('#impbox', el).scrollIntoView({ block: 'start' }), 60);
  });
}

/* ---------- navigazione e azioni ---------- */
function render() {
  for (const a of document.querySelectorAll('nav.tabs a')) {
    if (a.dataset.tab === S.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  const y = window.scrollY;
  if (S.tab === 'oggi') renderOggi();
  else if (S.tab === 'spot') renderSpot();
  else if (S.tab === 'diario') renderDiario();
  else if (S.tab === 'catture') renderCatture();
  else renderSpecie();
  if (S._renderedTab === S.tab) window.scrollTo(0, y); else window.scrollTo(0, 0);
  S._renderedTab = S.tab;
  hydrate(app);
}
function route() {
  const h = (location.hash || '#oggi').slice(1);
  S.tab = ['oggi', 'spot', 'diario', 'catture', 'specie'].includes(h) ? h : 'oggi';
  if (S.tab !== 'spot') { S.mapAdd = false; }
  render();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'closebg') { if (e.target === el) closeSheet(); return; }
  if (act === 'close') { closeSheet(); return; }
  if (el.dataset.close) closeSheet();
  switch (act) {
    case 'day': S.dayOffset = +el.dataset.i; render(); break;
    case 'go': location.hash = el.dataset.tab; break;
    case 'pickspot': openPickSpot(); break;
    case 'usespot': try { await Store.setRoot({ spotSel: el.dataset.id }); toast('Spot impostato per Oggi'); Meteo.refresh(currentSpot()); } catch (err) { toast(errMsg(err)); } break;
    case 'settings': openSettings(el.dataset.focus); break;
    case 'welcome-skip': try { await Store.setRoot({ benvenuto: true }); } catch (err) { toast(errMsg(err)); } break;
    case 'refresh-meteo': Meteo.refresh(currentSpot(), true); break;
    case 'locate-map':
      try { toast('Cerco la tua posizione…'); const p = await locate(); S.me = p; if (lmap) lmap.setView([p.lat, p.lon], Math.max(lmap.getZoom(), 15)); drawMe(); toast('Sei qui'); }
      catch (err) { toast(geoErr(err)); }
      break;
    case 'nearest':
      try {
        toast('Cerco la tua posizione…');
        const p = await locate();
        const near = S.spots.map(x => ({ x, d: distM(p.lat, p.lon, x.lat, x.lon) })).sort((a, b) => a.d - b.d)[0];
        if (!near) { toast('Non hai ancora spot salvati'); break; }
        await Store.setRoot({ spotSel: near.x.id });
        toast(`Più vicino: ${near.x.nome} (${fmtDist(near.d)})`);
        Meteo.refresh(currentSpot());
      } catch (err) { toast(err && err.code != null && typeof err.code === 'number' ? geoErr(err) : errMsg(err)); }
      break;
    case 'editspot': openSpotSheet(el.dataset.id); break;
    case 'mapadd': S.mapAdd = !S.mapAdd; render(); break;
    case 'zoomin': if (lmap) lmap.zoomIn(); break;
    case 'zoomout': if (lmap) lmap.zoomOut(); break;
    case 'maplayer': { const p = mapPref(); p.base = el.dataset.v; setMapPref(p); applyMapPref(); render(); break; }
    case 'mapsea': { const p = mapPref(); p.nautica = !p.nautica; setMapPref(p); applyMapPref(); render(); break; }
    case 'showspot': { const sp = S.spots.find(x => x.id === el.dataset.id); if (sp && lmap) { lmap.setView([sp.lat, sp.lon], Math.max(lmap.getZoom(), 15)); $('#mapbox').scrollIntoView({ behavior: 'smooth', block: 'center' }); } break; }
    case 'guide': openGuide(el.dataset.id); break;
    case 'cond': {
      const c = Object.assign({}, condToday()); const g = el.dataset.g, v = el.dataset.v;
      c[g] = c[g] === v ? '' : v;
      try { await Store.setRoot({ oggi: { data: isoDay(Date.now()), cond: c } }); } catch (err) { toast(errMsg(err)); }
      break;
    }
    case 'species': openSpecies(el.dataset.id); break;
    case 'gear': openGear(); break;
    case 'newtrip': openTripForm(null); break;
    case 'opentrip': openTrip(el.dataset.id); break;
    case 'edittrip': openTripForm(el.dataset.id); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet-root').firstChild) closeSheet(); });
// aggiorna l'indice di "adesso" ogni 5 minuti quando non c'è un foglio aperto
setInterval(() => { if (!$('#sheet-root').firstChild && S.tab === 'oggi' && S.dayOffset === 0) render(); }, 5 * MIN);

Store.load();
Meteo.load();
Taxa.load();
route();
Meteo.refresh(currentSpot());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!$('#sheet-root').firstChild) render();
  Meteo.refresh(currentSpot());
});
window.addEventListener('online', () => { Meteo.refresh(currentSpot(), true); Taxa.pump(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* facoltativo */ }
})();
</script>
